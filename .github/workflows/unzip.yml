name: Unzip
on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          z=$(ls *.zip | head -1)
          unzip -o "$z" -x "__MACOSX/*"
          rm "$z"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project" || echo "nothing to commit"
          git push
